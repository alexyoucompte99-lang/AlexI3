name: Refresh consoles

on:
  repository_dispatch:
    types: [refresh]
  workflow_dispatch:
  schedule:
    - cron: "*/15 5-21 * * *"   # toutes les 15 min, 7h-23h heure de Paris (été)

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Europe/Paris   # bornes de dates (jour en cours) en heure de Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install --quiet openpyxl

      - name: Recuperer les donnees (pont Apps Script)
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        working-directory: pipeline
        run: |
          curl -sfL --retry 4 --retry-delay 6 --retry-all-errors "$BRIDGE_URL?key=$BRIDGE_KEY&what=closing" -o closing.b64
          if grep -q "acces refuse" closing.b64; then echo "cle du pont refusee"; exit 1; fi
          base64 -d closing.b64 > investisseurs30.xlsx
          python -c "import openpyxl; wb=openpyxl.load_workbook('investisseurs30.xlsx', read_only=True); print('onglets:', len(wb.sheetnames))"
          curl -sfL --retry 4 --retry-delay 6 --retry-all-errors "$BRIDGE_URL?key=$BRIDGE_KEY&what=ads" -o ads_values.json

      - name: Pipeline
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_ACCOUNT: ${{ secrets.META_ACCOUNT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ALEX_CODE: ${{ secrets.ALEX_CODE }}
          PILOTAGE_CODE: ${{ secrets.PILOTAGE_CODE }}
          WA_THOMAS: ${{ secrets.WA_THOMAS }}
          WA_ALEX: ${{ secrets.WA_ALEX }}
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          PAGE_CODE: ${{ secrets.PAGE_CODE }}
          FUNNEL_CODE: ${{ secrets.FUNNEL_CODE }}
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          VALAR_URL: ${{ secrets.VALAR_URL }}
          VALAR_TOKEN: ${{ secrets.VALAR_TOKEN }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          PARSE_XLSX: ${{ github.workspace }}/pipeline/parse_xlsx.py
        working-directory: pipeline
        run: |
          python parse_xlsx.py investisseurs30.xlsx data.json
          python sales_ledger.py data.json ../.sales-ledger.json
          python parse_ads_values.py ads_values.json ads.json
          python meta_fetch.py
          python tally_fetch.py || true
          # Leads Valar (CRM business Valar, onglet Leads Valar de la console closing)
          python valar_fetch.py || true
          python eow_notify.py investisseurs30.xlsx ../.eow-count ../.eod-count ../.idea-count ../.eodsetter-count ../.valarclaim-count || true
          # Onglet Funnel : on repart du bloc chiffre de console-suivi-i3 (c'est la
          # que se fait le releve pixel manuel), a defaut de notre propre copie, puis
          # closing et ads sont rafraichis ici comme le reste de la console.
          ( set -e
            cd funnel
            curl -sfL --retry 3 --retry-delay 4 -o upstream.enc \
              https://raw.githubusercontent.com/alexyoucompte99-lang/console-suivi-i3/main/data-block.enc || true
            for f in upstream.enc ../../funnel-data.enc; do
              [ -s "$f" ] || continue
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -base64 -A \
                -pass env:DATA_KEY -in "$f" -out data-block.js 2>/dev/null || continue
              grep -q "var RELEVE" data-block.js && break
            done
            grep -q "var RELEVE" data-block.js
            # le classeur closing vient d'etre telecharge et parse juste au-dessus :
            # on reutilise data.json au lieu de refaire un aller-retour de 3 Mo par le pont
            mkdir -p sources && cp ../data.json sources/data_closing.json
            python fetch_sources.py --no-closing || echo "sources funnel KO : on garde celles du bloc precedent"
            python gen_data.py --prev=data-block.js
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -salt -base64 -A \
              -pass env:DATA_KEY -in data-block.js -out ../../funnel-data.enc
            python funnel_fragment.py funnel-template.html data-block.js \
              ../funnel-fragment.css ../funnel-fragment.html
          ) || echo "PIPELINE FUNNEL KO : onglet Funnel indisponible sur cette MAJ"
          NOW=$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')
          # SOURCES_AT change a chaque run : exclu du hash, sinon plus aucun court-circuit
          HASH=$( { cat data.json ads.json tally.json valar.json 2>/dev/null; \
                    grep -v "^var SOURCES_AT" funnel/data-block.js 2>/dev/null; } | sha256sum | cut -d" " -f1)
          OLD=$(cat ../.data-hash 2>/dev/null || echo none)
          if [ "$HASH" = "$OLD" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "donnees inchangees, pas de rebuild"
            cd ..
            git config user.name "console-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .eow-count .eod-count .idea-count .eodsetter-count .valarclaim-count 2>/dev/null || true
            git diff --cached --quiet || (git commit -m "EOW/EOD/idees/EOD setter/reclamations notifies" && git push)
            exit 0
          fi
          echo "$HASH" > ../.data-hash
          python aggregate.py data.json ads.json dashboard-data.json "$NOW"
          python build.py
          python aggregate_closing.py data.json closing-data.json "$NOW"
          python build.py closing-data.json closing-template.html closing.html
          python encrypt_page.py dashboard.html ../index.html "$PAGE_CODE" "Console business · Investisseurs 3.0"
          python encrypt_page.py closing.html ../closing/index.html "$PAGE_CODE" "Console closing · Investisseurs 3.0"

      - name: Publier
        run: |
          git config user.name "console-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html closing/index.html .data-hash
          git add closing/v.txt 2>/dev/null || true
          git add v.txt 2>/dev/null || true
          git add .sales-ledger.json funnel-data.enc 2>/dev/null || true
          git add .eow-count .eod-count .idea-count .eodsetter-count .valarclaim-count 2>/dev/null || true
          git diff --cached --quiet && echo "rien a publier" || (git commit -m "MAJ auto consoles" && git push)
